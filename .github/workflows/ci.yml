name: ci

# Three triggers, three sizes (PAY-975):
#   schedule     → the spec-drift check only (that is all the cron is for)
#   pull_request → spec + one PHP + one Node
#   push to main → spec + the full PHP and Node matrices, once, never cancelled
# Before this every trigger ran all seven jobs — six matrix jobs a day for a
# cron whose only question is "did the live spec move".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 1 * * *" # daily spec-drift check
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: openapi.json matches the live spec
        run: |
          curl -sf https://pay.kasera.id/v1/openapi.json | python3 -m json.tool --indent 2 > /tmp/live.json
          diff -u openapi.json /tmp/live.json || { echo "::error::openapi.json drifted from the live /v1 spec: refresh it and check every SDK"; exit 1; }

  php:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # PR tier: newest only. Push tier: every supported version.
        php: ${{ github.event_name == 'pull_request' && fromJSON('["8.3"]') || fromJSON('["8.1", "8.3"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: zend.assertions=-1
      - run: composer validate --strict
      - run: composer install --no-interaction
      - run: composer test
      - run: for f in php/src/*.php php/examples/*.php; do php -l "$f"; done

  js:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        node: ${{ github.event_name == 'pull_request' && fromJSON('["22"]') || fromJSON('["20", "22", "24"]') }}
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: types match openapi.json
        run: npm run gen && git diff --exit-code src/schema.d.ts
      - run: npm test
      - run: npm pack --dry-run
